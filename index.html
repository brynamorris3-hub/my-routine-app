<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8b5cf6"><title>My Routine Adventure</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#44365c;background:#f9edfc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#ffe9f3,#ece9ff 55%,#e3f8f3);background-attachment:fixed}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:10px 15px;background:#7851d4;color:white;font-weight:650}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#eee7ff;color:#553b93}button.ghost{background:transparent;color:#6a4bad;border:1px solid #d9ccf8}button.small{padding:6px 10px;font-size:.86rem}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e09bff;outline-offset:2px}header{max-width:960px;margin:auto;padding:26px 16px 10px;text-align:center}h1{color:#7846c5;font-size:clamp(1.8rem,5vw,2.7rem);margin:0}h2{margin:0 0 12px;color:#6843ae}h3{margin:0 0 8px;color:#6843ae}p{line-height:1.5}header p{margin:8px 0}.shell{max-width:960px;margin:auto;padding:0 14px 70px}.nav{display:flex;gap:7px;overflow-x:auto;padding:8px 0 15px;position:sticky;top:0;z-index:3;background:#f8edfae8;backdrop-filter:blur(8px)}.nav button{white-space:nowrap;background:#fff;color:#6446a0;border:1px solid #e4d7f6}.nav button.active{background:#7851d4;color:white}.card{background:#fffffff2;border:1px solid #f0e7fb;box-shadow:0 10px 28px #65508c16;border-radius:21px;padding:20px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted{color:#786d89;font-size:.92rem}.pill{display:inline-block;background:#f0e8ff;color:#6542a5;border-radius:30px;padding:4px 10px;font-size:.8rem;font-weight:700}.progress{height:13px;background:#eee7f7;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#d38de6,#8660df);transition:width .2s}.stage{border:1px solid #e9ddfa;border-radius:17px;margin:12px 0;overflow:hidden;background:#fff}.stage>button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border-radius:0;background:#f4eeff;color:#553a91;padding:14px}.stage.locked>button{background:#f7f5f9;color:#8c8595}.stage-content{padding:10px 14px}.task{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid #f3eef8}.task:last-child{border:0}.task input{width:20px;height:20px;accent-color:#8654c7;flex-shrink:0}.task span{flex:1}.task.done span{text-decoration:line-through;color:#8b8197}.task small{color:#7a6c8d}.stat{font-size:1.7rem;font-weight:800;color:#7345c1}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field input,.field select,.field textarea{border:1px solid #d9c9ed;border-radius:11px;padding:10px;background:#fff;color:#453458;width:100%}.field textarea{min-height:70px}.buttonrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.notice{background:#f5efff;padding:11px 13px;border-radius:13px}.hidden{display:none!important}.entry{padding:12px 0;border-bottom:1px solid #eee7f7}.entry:last-child{border:0}.spark{animation:pop .45s ease}@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.025)}100%{transform:scale(1)}}.timer{font-size:2.7rem;font-variant-numeric:tabular-nums;font-weight:750;text-align:center;color:#6f49bd;margin:12px}.foot{text-align:center;color:#746986;font-size:.82rem;padding:15px}details{border:1px solid #ece3f9;border-radius:12px;padding:10px;margin:8px 0}summary{cursor:pointer;font-weight:650}.badge{font-size:.76rem;color:#775e9e;background:#f3edfa;padding:3px 8px;border-radius:15px}.mini{font-size:.83rem}.milestone{display:flex;align-items:center;gap:9px;margin:8px 0}.milestone input{width:20px;height:20px;accent-color:#8654c7}.error{color:#9d2459}@media(max-width:500px){.card{padding:15px}.shell{padding:0 10px 50px}}
</style></head><body>
<header><h1>🦋 My Routine Adventure</h1><p>Every accomplishment counts!</p><div class="muted" id="date-label"></div></header>
<div class="shell"><nav class="nav" aria-label="App sections" id="nav"></nav><main id="view"></main><div class="foot">Progress is saved on this device. Use Settings → Export backup to keep a copy.</div></div>
<script>
'use strict';
const STORE='routine-adventure-v1';
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const weekKey=()=>{const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return todayKeyFrom(d)};
const todayKeyFrom=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const defaultData=()=>({daily:{},weekly:{},minutes:{},games:{},gameChecks:{},prefs:{sound:true},notes:{},custom:[],history:{}});
let data;try{data={...defaultData(),...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){data=defaultData()}
let page='Home', expandedStage=0, motivationStep=0, timerStart=0, timerElapsed=0, timerRunning=false, timerInterval=null, timerCategory='Writing';
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){alert('Storage is full or unavailable. Export a backup in Settings.')}};
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const daily=()=>data.daily[todayKey()]??(data.daily[todayKey()]={});
const weekly=()=>data.weekly[weekKey()]??(data.weekly[weekKey()]={});
const isDone=(id,scope='daily')=>!!(scope==='weekly'?weekly():daily())[id];
const setDone=(id,checked,scope='daily')=>{(scope==='weekly'?weekly():daily())[id]=checked;save();if(checked)chime();advanceStage();render()};
const getMinutes=id=>Number((data.minutes[todayKey()]||{})[id]||0);
const addMinutes=(id,amount)=>{if(!Number.isFinite(amount)||amount<=0)return;const bucket=data.minutes[todayKey()]??(data.minutes[todayKey()]={});bucket[id]=Math.round((Number(bucket[id]||0)+amount)*10)/10;save();chime();advanceStage();render()};
const getNumber=id=>Number(daily()['num:'+id]||0);
const setNumber=(id,n)=>{daily()['num:'+id]=Math.max(0,Number(n)||0);save();chime();advanceStage();render()};
const dayOfWeek=()=>new Date().getDay();
const isShowerDay=()=>[1,3,5].includes(dayOfWeek());
const goals=[
{id:'dressed',name:'Get dressed',type:'check',targets:[1,null,null],detail:'Aim for before Tzippora wakes; no reminder'},
{id:'breakfast',name:'Breakfast',type:'count',targets:[1,2,3],unit:'breakfast steps'},
{id:'water',name:'Water',type:'count',targets:[4,6,8],unit:'glasses (250 mL each)',detail:'8 glasses = 2 litres'},
{id:'jobs',name:'Job applications',type:'count',targets:[1,2,3],unit:'applications'},
{id:'learning',name:'Professional development',type:'minutes',targets:[30,45,60],detail:'Xero, QBO Advanced or QBO Payroll'},
{id:'writing',name:'Writing',type:'minutes',targets:[15,30,45]},
{id:'emails',name:'Emails',type:'minutes',targets:[30,45,60]},
{id:'paperwork',name:'Paperwork',type:'minutes',targets:[30,45,60]},
{id:'puzzle',name:'Puzzling',type:'check',targets:[1,null,null]},
{id:'tidy',name:'Tidy for 5 minutes',type:'check',targets:[1,null,null]},
{id:'shower',name:'Shower',type:'check',targets:[1,null,null],detail:'Scheduled Monday, Wednesday and Friday',only:()=>isShowerDay()},
{id:'teeth',name:'Brush teeth',type:'weeklyCount',targets:[2,null,null],detail:'Two days per week, with PSW support'},
{id:'earrings',name:'Earrings',type:'weeklyCount',targets:[1,null,null],detail:'Once per week; extra days count'},
{id:'skincare',name:'Skin care',type:'weeklyCount',targets:[1,null,null],detail:'Once per week; extra days count'}
];
function weeklyCount(id){const prefix=id+':';return Object.entries(weekly()).filter(([k,v])=>k.startsWith(prefix)&&v).length}
function value(g){if(g.type==='minutes')return getMinutes(g.id);if(g.type==='count')return getNumber(g.id);if(g.type==='weeklyCount')return weeklyCount(g.id);return isDone(g.id)?1:0}
function activeGoals(){return goals.filter(g=>!g.only||g.only())}
function stageGoals(i){return activeGoals().filter(g=>g.targets[i]!=null)}
function stageDone(i){return stageGoals(i).every(g=>value(g)>=g.targets[i])}
function unlocked(i){return i===0||stageDone(i-1)&&unlocked(i-1)}
function advanceStage(){if(stageDone(0)&&!stageDone(1))expandedStage=1;else if(stageDone(1))expandedStage=2}
function allProgress(){let total=0,done=0;for(let i=0;i<3;i++)for(const g of stageGoals(i)){total++;if(value(g)>=g.targets[i])done++}return{total,done}}
function progressHTML(done,total){return `<div class="progress" role="progressbar" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${total}"><div style="width:${total?100*done/total:0}%"></div></div>`}
function chime(){if(!data.prefs.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();[660,880].forEach((f,i)=>{const o=ctx.createOscillator(),gain=ctx.createGain();o.type='sine';o.frequency.value=f;o.connect(gain);gain.connect(ctx.destination);const t=ctx.currentTime+i*.13;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.09,t+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.2)});setTimeout(()=>ctx.close(),650)}catch(e){}}
const tabs=['Home','Money Apps','929','Timer','Motivation','Settings'];
function render(){document.getElementById('date-label').textContent=new Intl.DateTimeFormat('en-CA',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(new Date());document.getElementById('nav').innerHTML=tabs.map(t=>`<button type="button" data-tab="${t}" class="${page===t?'active':''}">${t==='Home'?'🏠 ':t==='Money Apps'?'💰 ':t==='929'?'📖 ':t==='Timer'?'⏱️ ':t==='Motivation'?'✨ ':'⚙️ '}${t}</button>`).join('');const view=document.getElementById('view');view.innerHTML=page==='Home'?homeHTML():page==='Money Apps'?moneyHTML():page==='929'?studyHTML():page==='Timer'?timerHTML():page==='Motivation'?motivationHTML():settingsHTML();bindEvents()}
function homeHTML(){const p=allProgress();return `<div class="card"><div class="row"><div><h2>Today's Adventure</h2><div class="muted">One accomplishment at a time</div></div><div class="stat">${p.done}/${p.total}</div></div>${progressHTML(p.done,p.total)}<p class="muted">Daily and weekly tasks count toward your stages. Higher levels are cumulative.</p><button data-tab="Motivation" class="secondary">I need motivation ✨</button></div><div class="card"><h2>My stages</h2>${[0,1,2].map(stageHTML).join('')}${stageDone(2)?'<p class="notice spark">🎉 All three stages completed! Every effort counts.</p>':''}</div><div class="card"><div class="row"><h2>Bonus accomplishments</h2><span class="pill">No unlocking requirement</span></div><p class="muted">Money apps, walking, and anything extra are worthwhile but never block the next stage.</p><button data-tab="Money Apps">Open money-earning apps</button></div>`}
function stageHTML(i){const name=['🦋 Butterfly','🐛 Caterpillar','🌱 Larva'][i];const tasks=stageGoals(i),count=tasks.filter(g=>value(g)>=g.targets[i]).length,lock=!unlocked(i),complete=stageDone(i),open=!lock&&(expandedStage===i||(!complete&&expandedStage===-1));return `<div class="stage ${lock?'locked':''}"><button type="button" data-stage="${i}" ${lock?'disabled':''}><span>${name} ${complete?'✓':''}<span class="muted"> · ${count}/${tasks.length}</span></span><span>${lock?'🔒':open?'▴':'▾'}</span></button>${open?`<div class="stage-content">${tasks.map(g=>goalHTML(g,i)).join('')}</div>`:''}</div>`}
function goalHTML(g,i){const v=value(g),target=g.targets[i],done=v>=target;let action='';if(g.type==='check'){action=`<input type="checkbox" data-check="${g.id}" ${done?'checked':''} aria-label="${escapeHTML(g.name)}">`}else if(g.type==='weeklyCount'){action=`<input type="checkbox" data-weekcheck="${g.id}" ${!!weekly()[g.id+':'+todayKey()]?'checked':''} aria-label="${escapeHTML(g.name)} today">`}else{action=`<button type="button" class="small secondary" data-adjust="${g.id}" data-delta="${g.type==='minutes'?-5:-1}">−</button><button type="button" class="small" data-adjust="${g.id}" data-delta="${g.type==='minutes'?5:1}">+</button>`}return `<div class="task ${done?'done':''}"><span><strong>${escapeHTML(g.name)}</strong><div class="mini muted">${g.type==='check'?'Complete once':g.type==='weeklyCount'?`${v}/${target} days this week`:g.type==='minutes'?`${v}/${target} minutes total`:`${v}/${target} ${escapeHTML(g.unit||'completed')}`}${g.detail?` · ${escapeHTML(g.detail)}`:''}</div></span>${action}</div>`}
const walks=[{id:'cashwalk',name:'CashWalk',tasks:['Collect coins (8 PM)','Ads 1–3','Ads 4–6']},{id:'weward',name:'WeWard',tasks:['Convert steps','4 ads','1 card','Step goal progress']},{id:'macadam',name:'Macadam',tasks:['Validate steps','Collect a bat','4 spins']},{id:'ahealth',name:'A Health / Money Walk',tasks:['Check and collect daily rewards']}];
const gameDefs=[{id:'dice',name:'Dice Dreams',level:119,milestones:[125,175,275,300],rewards:['$0.50','$1','$3.50','$10.50'],deadline:'2026-11-09'},{id:'kingdom',name:'Kingdom',level:99,milestones:[]},{id:'journey',name:'Journey Home',level:44,milestones:[],deadline:'2026-09-28'},{id:'yarnation',name:'Yarnation',level:205,milestones:[]},{id:'knockout',name:'Knockout',level:683,milestones:[600,700,800],deadline:'2026-10-10'},{id:'bingo',name:'Bingo Voyage',level:0,milestones:[],deadline:'2026-10-13'},{id:'words',name:'Words of Wonder',level:0,milestones:[]}];
function moneyHTML(){return `<div class="card"><h2>💰 Money-earning apps</h2><p class="muted">Bonus tasks only. These do not affect Butterfly, Caterpillar, or Larva unlocking.</p><h3>🚶 Walking apps</h3><p class="muted">Suggested daily time: 15–20 minutes. You can record steps and ad tasks below.</p><div class="grid">${walks.map(w=>`<div class="stage"><div class="stage-content"><h3>${w.name}</h3>${w.tasks.map(t=>`<label class="task"><input type="checkbox" data-bonus="${w.id+':'+t}" ${isDone('bonus:'+w.id+':'+t)?'checked':''}><span>${escapeHTML(t)}</span></label>`).join('')}${w.id==='weward'?`<div class="field"><label for="steps">Steps today (goal 10,000)</label><input id="steps" type="number" min="0" step="100" value="${getNumber('steps')}"></div>${progressHTML(Math.min(getNumber('steps'),10000),10000)}`:''}</div></div>`).join('')}</div></div><div class="card"><h2>🎮 Games and milestones</h2><p class="muted">Enter your current level; milestones and deadlines can be edited in Settings or in the game card. Dates below are estimates from your earlier notes, not live Testerup data.</p>${gameDefs.map(gameHTML).join('')}</div>`}
function gameHTML(g){const saved=data.games[g.id]||{},level=saved.level??g.level,ms=saved.milestones??g.milestones,deadline=saved.deadline??g.deadline??'';const expired=deadline&&deadline<todayKey();return `<details><summary>${escapeHTML(g.name)} · Level ${escapeHTML(level)} ${expired?'<span class="badge">Estimated deadline passed</span>':''}</summary><div class="field"><label>Current level<input type="number" min="0" data-gamelevel="${g.id}" value="${escapeHTML(level)}"></label></div><div class="field"><label>Milestone levels (comma separated)<input data-gamems="${g.id}" value="${escapeHTML(ms.join(', '))}"></label></div><div class="field"><label>Offer deadline (optional)<input type="date" data-gamedate="${g.id}" value="${escapeHTML(deadline)}"></label></div>${ms.length?`<div class="muted">Upcoming milestones:</div>${ms.filter(n=>n>level).slice(0,4).map(n=>`<div class="milestone"><span>Level ${n}</span>${g.id==='dice'&&g.milestones.includes(n)?`<span class="badge">${g.rewards[g.milestones.indexOf(n)]}</span>`:''}</div>`).join('')||'<p class="muted">No upcoming milestones in the list.</p>'}`:''}<button class="small" data-savegame="${g.id}">Save game</button></details>`}
function studyHTML(){const count=getNumber('perakim');return `<div class="card"><h2>📖 929 learning</h2><p>Weekly goal: <strong>5 perakim</strong>. Friday and Shabbat are available for catching up.</p><div class="row"><span class="stat">${count}/5</span><div class="buttonrow"><button class="secondary" data-adjust="perakim" data-delta="-1">− 1</button><button data-adjust="perakim" data-delta="1">+ 1 perek</button></div></div>${progressHTML(Math.min(count,5),5)}<p class="muted">This is a daily counter for now. Use the weekly tracker below for your actual weekly progress.</p><div class="row"><span>Completed this week: <strong>${Number(weekly()['929-count']||0)}/5</strong></span><div class="buttonrow"><button class="secondary" data-week929="-1">−</button><button data-week929="1">+</button></div></div><p class="muted">Weekly progress resets on Monday. A more detailed missed-pesukim schedule can be added later.</p></div>`}
function timerHTML(){return `<div class="card"><h2>⏱️ Focus timer</h2><p class="muted">Track actual minutes and add them to a routine category.</p><div class="field"><label for="timer-category">Activity</label><select id="timer-category">${['Writing','Professional development','Emails','Paperwork'].map((s,i)=>`<option value="${['writing','learning','emails','paperwork'][i]}" ${timerCategory===['writing','learning','emails','paperwork'][i]?'selected':''}>${s}</option>`).join('')}</select></div><div class="timer" id="timer-display">${timerText()}</div><div class="buttonrow"><button id="timer-toggle">${timerRunning?'Pause':'Start'}</button><button class="secondary" id="timer-reset">Reset</button><button id="timer-log">Log time to goal</button></div><p class="muted">Timer time is kept while this page stays open. Log it before closing the page.</p></div>`}
function timerText(){const n=Math.floor((timerElapsed+(timerRunning?Date.now()-timerStart:0))/1000);return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function motivationHTML(){const messages=[['Choose just one small task. You do not need to finish everything.','Pick the easiest available goal and do the first two minutes.'],['Every task you complete counts.','Open the Butterfly stage and choose one checkbox you can earn today.'],['A small amount of progress is still progress.','Set the timer for five minutes and begin one activity.']];const m=messages[motivationStep%messages.length];return `<div class="card"><h2>✨ A little momentum</h2><p class="notice">${m[0]}</p><p>${m[1]}</p><div class="buttonrow"><button data-motivate="next">Another prompt</button><button class="secondary" data-tab="Home">Go to my goals</button></div></div><div class="card"><h2>When the day feels defeated</h2><p>Some days the win is simply showing up. The checklist isn't a verdict on your day.</p><button data-joke="1">Give me a little humour</button><p id="joke-output"></p></div>`}
function settingsHTML(){return `<div class="card"><h2>⚙️ Settings and backups</h2><label class="task"><input id="sound-setting" type="checkbox" ${data.prefs.sound?'checked':''}><span>Play a happy sound when I complete something</span></label><h3>Keep your progress safe</h3><p class="muted">Your information stays in this browser. It does not automatically sync to another device. Export a backup before switching phones, browsers, or clearing website data.</p><div class="buttonrow"><button id="export-data">Export backup</button><label class="secondary" style="display:inline-block;padding:10px 15px;background:#eee7ff;color:#553b93;border-radius:13px;cursor:pointer;font-weight:650">Import backup <input type="file" id="import-data" accept="application/json,.json" hidden></label></div><p class="notice">Importing a backup replaces the progress currently saved on this device.</p><h3>About this version</h3><p class="muted">This is a standalone, offline-capable-after-loading webpage, but GitHub Pages itself requires internet for the initial visit. For reliable offline use, we'll add a service worker in a later release. The weekly and daily routines are editable through future updates; no personal information is sent to a server by this app.</p></div>`}
function bindEvents(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{page=b.dataset.tab;render();window.scrollTo(0,0)});document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.stage);expandedStage=expandedStage===i?-1:i;render()});document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>setDone(e.dataset.check,e.checked));document.querySelectorAll('[data-weekcheck]').forEach(e=>e.onchange=()=>{weekly()[e.dataset.weekcheck+':'+todayKey()]=e.checked;save();if(e.checked)chime();advanceStage();render()});document.querySelectorAll('[data-adjust]').forEach(b=>b.onclick=()=>{const id=b.dataset.adjust,delta=Number(b.dataset.delta);if(['writing','learning','emails','paperwork'].includes(id)){const bucket=data.minutes[todayKey()]??(data.minutes[todayKey()]={});bucket[id]=Math.max(0,getMinutes(id)+delta);save();advanceStage();render()}else setNumber(id,getNumber(id)+delta)});document.querySelectorAll('[data-bonus]').forEach(e=>e.onchange=()=>setDone('bonus:'+e.dataset.bonus,e.checked));const steps=document.getElementById('steps');if(steps)steps.onchange=()=>setNumber('steps',steps.value);document.querySelectorAll('[data-savegame]').forEach(b=>b.onclick=()=>{const id=b.dataset.savegame;const level=Number(document.querySelector(`[data-gamelevel="${id}"]`).value)||0;const milestones=document.querySelector(`[data-gamems="${id}"]`).value.split(',').map(x=>Number(x.trim())).filter(n=>Number.isFinite(n)&&n>0).sort((a,b)=>a-b);const deadline=document.querySelector(`[data-gamedate="${id}"]`).value;data.games[id]={level,milestones,deadline};save();render()});document.querySelectorAll('[data-week929]').forEach(b=>b.onclick=()=>{weekly()['929-count']=Math.max(0,Number(weekly()['929-count']||0)+Number(b.dataset.week929));save();render()});const cat=document.getElementById('timer-category');if(cat)cat.onchange=()=>timerCategory=cat.value;const toggle=document.getElementById('timer-toggle');if(toggle)toggle.onclick=()=>{if(timerRunning){timerElapsed+=Date.now()-timerStart;timerRunning=false}else{timerStart=Date.now();timerRunning=true}render()};const reset=document.getElementById('timer-reset');if(reset)reset.onclick=()=>{timerRunning=false;timerElapsed=0;render()};const log=document.getElementById('timer-log');if(log)log.onclick=()=>{const ms=timerElapsed+(timerRunning?Date.now()-timerStart:0),minutes=Math.round(ms/60000);if(minutes<1){alert('Please record at least one minute.');return}timerRunning=false;timerElapsed=0;addMinutes(timerCategory,minutes)};document.querySelectorAll('[data-motivate]').forEach(b=>b.onclick=()=>{motivationStep++;render()});const joke=document.querySelector('[data-joke]');if(joke)joke.onclick=()=>document.getElementById('joke-output').textContent='Why did the butterfly bring a notebook? To keep track of its little wins. 🦋';const sound=document.getElementById('sound-setting');if(sound)sound.onchange=()=>{data.prefs.sound=sound.checked;save()};const exp=document.getElementById('export-data');if(exp)exp.onclick=()=>{const blob=new Blob([JSON.stringify({app:'My Routine Adventure',version:1,exported:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-routine-backup-'+todayKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};const imp=document.getElementById('import-data');if(imp)imp.onchange=async()=>{const f=imp.files?.[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(parsed.app!=='My Routine Adventure'||!parsed.data||typeof parsed.data!=='object')throw Error('Not a compatible backup');if(confirm('Replace the progress on this device with this backup?')){data={...defaultData(),...parsed.data};save();render();alert('Backup imported.')}}catch(e){alert('Could not import backup: '+e.message)}}}
setInterval(()=>{if(timerRunning){const e=document.getElementById('timer-display');if(e)e.textContent=timerText()}const d=document.getElementById('date-label');if(d&&d.dataset.day!==todayKey()){d.dataset.day=todayKey();if(page==='Home')render()}},1000);
advanceStage();render();
</script></body></html>
