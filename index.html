<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1"> 
        <title>My Routine Adventure</title>
   
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #fce7f3, #e0e7ff);
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        text-align: center;
        color: #43345c;
    }

    h1 {
        color: #8b5cf6;
        font-size: 32px;
    }

    p {
        font-size: 18px;
    }

    .welcome-card {
        background: white;
        border-radius: 20px;
        padding: 24px;
        max-width: 500px;
        margin: 30px auto;
        box-shadow: 0 8px 25px rgba(80, 50, 120, 0.12);
    }
</style>
    </head>    
     <body>
    <div class="welcome-card">
     <h1>🦋 My Routine Adventure</h1>
     <p>Everry accomplishment counts!</p>
     <p>Your adventure begins here.</p> 
        </div> 
         <section class="welcome-card">
    <h2>🦋 My Butterfly Goals</h2>
    <p>Small steps, real accomplishments!</p>

    <label><input type="checkbox" class="butterfly-task"> Get dressed</label>
    <br>
    <label><input type="checkbox" class="butterfly-task"> Eat breakfast</label>
    <br>
    <label><input type="checkbox" class="butterfly-task"> Drink water</label>
    <br>
    <label><input type="checkbox" class="butterfly-task"> Work on job applications</label>

    <p id="butterfly-progress">0 of 4 goals completed</p>
</section>
<script>
    const tasks = document.querySelectorAll(".butterfly-task");
    const progress = document.getElementById("butterfly-progress");

    function updateProgress() {
        const completed = document.querySelectorAll(".butterfly-task:checked").length;
        progress.textContent = completed + " of " + tasks.length + " goals completed";
    }

    tasks.forEach(function(task) {
        task.addEventListener("change", updateProgress);
    });
</script>
     </body>
</html>
